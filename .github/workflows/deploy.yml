name: Deploy site to GitHub Pages

on:
  # Manual-only: trigger from the Actions tab ("Run workflow"), not on every push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Force the node24 runtime for JS actions during GitHub's node20 → node24
# transition, so no action falls back to the deprecated node20 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Landing page → served at /cage-bro ──────────────────────────────
      - name: Install landing-page dependencies
        run: bun install --frozen-lockfile
        working-directory: landing-page

      - name: Build landing page
        run: bun run build
        working-directory: landing-page
        env:
          BASE_PATH: /cage-bro/

      # ── Dashboard → served at /cage-bro/dashboard ───────────────────────
      - name: Install dashboard dependencies
        run: bun install --frozen-lockfile
        working-directory: crates/cage-bro/dashboard

      - name: Build dashboard
        run: bun run build
        working-directory: crates/cage-bro/dashboard
        env:
          BASE_PATH: /cage-bro/dashboard/
          VITE_MOCK: "true"

      # ── Assemble the combined site: landing at root, dashboard nested ───
      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r landing-page/dist/. _site/
          mkdir -p _site/dashboard
          cp -r crates/cage-bro/dashboard/dist/. _site/dashboard/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
