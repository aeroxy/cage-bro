name: Deploy Dashboard to GitHub Pages

on:
  # Manual-only: trigger from the Actions tab ("Run workflow"), not on every push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: crates/cage-bro/dashboard

      - name: Build dashboard
        run: bun run build
        working-directory: crates/cage-bro/dashboard
        env:
          BASE_PATH: /cage-bro/
          VITE_MOCK: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/cage-bro/dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
