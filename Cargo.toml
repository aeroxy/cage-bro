[workspace]
resolver = "2"
members = [
    "crates/cage-bro",
    "crates/cage-bro-runtime",
    "crates/cage-bro-code",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Requires std file locking (File::try_lock), stabilized in Rust 1.89.
rust-version = "1.89"
authors = ["Aero <aero.windwalker@gmail.com>"]
repository = "https://github.com/aeroxy/cage-bro"
license = "Apache-2.0"
readme = "README.md"
keywords = ["sandbox", "ai", "agents", "browser", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = { version = "0.8", features = ["ws"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Static assets
rust-embed = "8"

# Errors
anyhow = "1"
thiserror = "2"

# Async traits
async-trait = "0.1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }
