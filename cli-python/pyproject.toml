[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-bro-cli"
version = "0.2.0"
description = "CLI installer for cage-bro sandbox — downloads the Rust binary on install"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
    "cage-bro>=0.1.0",
]

[project.scripts]
cage-bro = "cage_bro_cli:main"
